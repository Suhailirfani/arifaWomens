{% extends 'base.html' %}

{% block title %}Confirm Staff Deletion | Arifa Women's Academy{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 3rem auto;">
  <div class="bento-card" style="text-align: center; border-color: rgba(244, 63, 94, 0.4);">
    <div class="stat-icon-wrapper bg-pastel-rose" style="margin: 0 auto 1rem; width: 60px; height: 60px; font-size: 1.8rem;">
      ⚠️
    </div>
    <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;">Delete Staff Record?</h2>
    <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem;">
      Are you sure you want to remove <b>{{ staff.full_name }}</b> ({{ staff.staff_id }} - {{ staff.designation }})?
    </p>

    <form method="post">
      {% csrf_token %}
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{% url 'staff:staff_profile' staff.id %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" style="background: var(--coral-primary);">
          Confirm Delete
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
