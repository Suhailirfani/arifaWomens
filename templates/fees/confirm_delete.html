{% extends 'base.html' %}

{% block title %}Confirm Delete {{ object_type }} | Darul Ma'arif Women's Academy{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 3rem auto;">
  <div class="bento-card" style="border-left: 5px solid var(--coral-primary); text-align: center; padding: 2.5rem 2rem;">
    <div style="font-size: 2.5rem; margin-bottom: 1rem;">⚠️</div>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Delete {{ object_type }}?</h2>
    <p style="font-size: 1.1rem; font-weight: 700; color: var(--rose-primary); margin-bottom: 1rem;">
      {{ object_name }}
    </p>
    <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.75rem;">
      {{ warning }}
    </p>

    <form method="post">
      {% csrf_token %}
      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <a href="{% url cancel_url %}" class="btn btn-secondary">Cancel &amp; Keep</a>
        <button type="submit" class="btn btn-primary" style="background: var(--coral-primary);">
          Yes, Delete Permanently
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
